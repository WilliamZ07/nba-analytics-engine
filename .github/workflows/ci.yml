name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: lakehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: lakehouse
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      DBT_PROFILES_DIR: transform
      DBT_PROJECT_DIR: transform
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Service Connectivity
        run: |
          python -c "import redis; r = redis.Redis(host='localhost', port=6379); assert r.ping(), 'Redis connection failed'"
          python -c "import psycopg2; conn = psycopg2.connect(host='localhost', port=5432, dbname='lakehouse', user='admin', password='adminpassword'); conn.close()"

      - name: Initialize Staging Schemas
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect(host='localhost', port=5432, dbname='lakehouse', user='admin', password='adminpassword')
          with conn.cursor() as cur:
              cur.execute('CREATE SCHEMA IF NOT EXISTS raw_nba;')
              cur.execute('CREATE SCHEMA IF NOT EXISTS analytics;')
          conn.commit()
          conn.close()
          "

      - name: Run Test Suite
        run: pytest tests/ -v