services:
  postgres:
    image: postgres:16-alpine
    container_name: nba_lakehouse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: nba_lakehouse_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: &database_environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["api"]

  ingest:
    build: .
    command: ["python", "-m", "ingestion.pipeline"]
    environment:
      <<: *database_environment
      DESTINATION__POSTGRES__CREDENTIALS: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-adminpassword}@postgres:5432/${POSTGRES_DB:-lakehouse}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["jobs"]

  transform:
    build: .
    command: ["dbt", "build", "--project-dir", "/app/transform", "--profiles-dir", "/app/transform"]
    environment: *database_environment
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["jobs"]

volumes:
  postgres_data: