version: 2

models:
  - name: player_game_stats
    description: "Player-game level table enriched with composite keys and individual shooting metrics."
    columns:
      - name: player_game_id
        tests:
          - unique
          - not_null
      - name: points
        tests:
          - not_null

  - name: dim_player_season_summary
    description: "Player-season aggregates containing per-game averages and true-shooting percentages."
    columns:
      - name: player_id
        tests:
          - not_null
      - name: season_id
        tests:
          - not_null
      - name: true_shooting_pct
        tests:
          - not_null

  - name: dim_team_summary
    description: "Team-season aggregates containing win totals, loss totals, and average points per game."
    columns:
      - name: team_id
        tests:
          - not_null
      - name: season_id
        tests:
          - not_null

  - name: fct_player_rolling_stats
    description: "Rolling 10-game window calculations tracking player scoring, rebounding, and surge differentials."
    columns:
      - name: player_game_id
        tests:
          - unique
          - not_null

  - name: fct_team_game_stats
    description: "Team-level box scores with joint possessions, pace, and single-game offensive/defensive ratings."
    columns:
      - name: team_game_id
        tests:
          - not_null
          - unique
      - name: game_possessions
        tests:
          - not_null
      - name: pace
        tests:
          - not_null
      - name: defensive_rating
        tests:
          - not_null

  - name: dim_team_advanced_ratings
    description: "Season-level team efficiency metrics with strength-of-schedule and opponent-adjusted ratings."
    columns:
      - name: team_id
        tests:
          - not_null
      - name: season_id
        tests:
          - not_null
      - name: adjusted_defensive_rating
        tests:
          - not_null
      - name: adjusted_net_rating
        tests:
          - not_null